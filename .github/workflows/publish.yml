name: publish

# Publishes to PyPI when a full (not pre-release) GitHub release is published,
# using PyPI Trusted Publishing: PyPI trusts this workflow directly, so no API
# token is stored. 0.x pre-releases stay GitHub-only.
on:
  release:
    types: [published]

jobs:
  build:
    if: ${{ !github.event.release.prerelease }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install -e '.[dev]'
      - run: pytest
      - name: Check the tag matches the package version
        run: |
          version=$(python -c "import syncdot; print(syncdot.__version__)")
          tag="${{ github.event.release.tag_name }}"
          test "v$version" = "$tag" || { echo "release tag $tag != package version $version"; exit 1; }
      - run: python -m build
      - run: twine check --strict dist/*
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  pypi:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/project/syncdot/
    permissions:
      id-token: write   # lets PyPI verify this workflow (Trusted Publishing)
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
